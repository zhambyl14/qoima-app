<!DOCTYPE html>
<html>
<head>

  <title>qoima</title>
  <link rel="manifest" href="manifest.json">

  <!-- Yandex Maps JS API v3 — «Магазины» картасы (тек веб-нұсқада, mobile
       Android/iOS Yandex MapKit native SDK қолданады, lib/core/map_init_*).
       Кілт: Yandex Cloud → Developer Dashboard → JavaScript API (v3-ке ғана
       жарамды кілт — ЕСКІ 2.1 endpoint "Invalid API key" қайтарады). -->
  <script src="https://api-maps.yandex.ru/v3/?apikey=89893703-17df-49a4-8c4a-7acf0df8e43a&lang=ru_RU" type="text/javascript"></script>
  <script>
    // Dart<->ymaps3 аралық жеңіл көпір: барлық ymaps3 типтерін dart:js_interop-қа
    // толық бейнелеудің орнына тар, нақты API беріледі (қате тәуекелі азырақ).
    // ЕСКЕРТУ: v3 координаталар реті [longitude, latitude] (v2.1-дегі
    // [latitude, longitude]-тен КЕРІ) — осы файл ішінде әр жерде ауыстырылады,
    // сыртқы (Dart) API әрқашан (lat, lng) ретімен қалады.
    window.qoimaMaps = {
      _maps: {},
      _clickHandler: null,
      ready: function () {
        return new Promise(function (resolve) {
          if (window.ymaps3) { window.ymaps3.ready.then(function () { resolve(true); }, function () { resolve(false); }); }
          else { resolve(false); }
        });
      },
      init: function (containerId, lat, lng, zoom) {
        var el = document.getElementById(containerId);
        if (!el || !window.ymaps3) return false;
        var y3 = window.ymaps3;
        var map = new y3.YMap(el, { location: { center: [lng, lat], zoom: zoom } });
        map.addChild(new y3.YMapDefaultSchemeLayer());
        map.addChild(new y3.YMapDefaultFeaturesLayer());
        map.addChild(new y3.YMapControls({ position: 'right' }).addChild(new y3.YMapZoomControl({})));
        window.qoimaMaps._maps[containerId] = { map: map, markers: {} };
        return true;
      },
      destroy: function (containerId) {
        var entry = window.qoimaMaps._maps[containerId];
        if (entry) { entry.map.destroy(); delete window.qoimaMaps._maps[containerId]; }
      },
      setClickHandler: function (fn) { window.qoimaMaps._clickHandler = fn; },
      addPlacemark: function (containerId, id, lat, lng) {
        var entry = window.qoimaMaps._maps[containerId];
        if (!entry || !window.ymaps3) return;
        var y3 = window.ymaps3;
        var marker = new y3.YMapDefaultMarker({
          coordinates: [lng, lat],
          color: '#00A862',
          onClick: function () {
            if (window.qoimaMaps._clickHandler) window.qoimaMaps._clickHandler(id);
          }
        });
        entry.map.addChild(marker);
        entry.markers[id] = marker;
      },
      fitBounds: function (containerId, pointsFlat) {
        var entry = window.qoimaMaps._maps[containerId];
        if (!entry) return;
        var pts = [];
        for (var i = 0; i < pointsFlat.length; i += 2) { pts.push([pointsFlat[i + 1], pointsFlat[i]]); }
        if (pts.length === 0) return;
        if (pts.length === 1) {
          entry.map.setLocation({ center: pts[0], zoom: 14, duration: 200 });
          return;
        }
        var minLng = pts[0][0], maxLng = pts[0][0], minLat = pts[0][1], maxLat = pts[0][1];
        for (var j = 1; j < pts.length; j++) {
          minLng = Math.min(minLng, pts[j][0]); maxLng = Math.max(maxLng, pts[j][0]);
          minLat = Math.min(minLat, pts[j][1]); maxLat = Math.max(maxLat, pts[j][1]);
        }
        var cLng = (minLng + maxLng) / 2, cLat = (minLat + maxLat) / 2;
        var span = Math.max(maxLng - minLng, maxLat - minLat);
        var zoom = span > 8 ? 4 : span > 3 ? 6 : span > 1 ? 8 : span > 0.3 ? 10 : span > 0.05 ? 13 : 15;
        entry.map.setLocation({ center: [cLng, cLat], zoom: zoom, duration: 200 });
      },
      // ── Админ картадан белгі қою (түрту арқылы, ескісін ауыстырады) ──────
      initPicker: function (containerId, lat, lng, zoom, hasInitial) {
        var el = document.getElementById(containerId);
        if (!el || !window.ymaps3) return false;
        var y3 = window.ymaps3;
        var map = new y3.YMap(el, { location: { center: [lng, lat], zoom: zoom } });
        map.addChild(new y3.YMapDefaultSchemeLayer());
        map.addChild(new y3.YMapDefaultFeaturesLayer());
        map.addChild(new y3.YMapControls({ position: 'right' }).addChild(new y3.YMapZoomControl({})));
        window.qoimaMaps._maps[containerId] = { map: map, markers: {} };
        var marker = null;
        function place(coords) {
          if (marker) { map.removeChild(marker); marker = null; }
          marker = new y3.YMapDefaultMarker({ coordinates: coords, color: '#DC2626' });
          map.addChild(marker);
          if (window.qoimaMaps._clickHandler) {
            window.qoimaMaps._clickHandler(containerId + '|' + coords[1] + '|' + coords[0]);
          }
        }
        if (hasInitial) { place([lng, lat]); }
        map.addChild(new y3.YMapListener({
          layer: 'any',
          onClick: function (_obj, ev) { place(ev.coordinates); }
        }));
        return true;
      }
    };
  </script>

</body>
</html>
